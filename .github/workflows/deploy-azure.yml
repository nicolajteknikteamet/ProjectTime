name: Deploy to Azure

# Driftsätter servern till Azure App Service (gratisnivån F1 räcker).
# Kräver repo-variabeln AZURE_WEBAPP_NAME och hemligheten AZURE_WEBAPP_PUBLISH_PROFILE,
# se deploy/azure/create-azure.sh.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish server
        run: dotnet publish src/ProjectTime.Server -c Release -o ${{ github.workspace }}/publish
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
      - name: Verify
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz" || true)
            if [ "$code" = "200" ]; then echo "Servern svarar."; exit 0; fi
            echo "Väntar på servern ($code)…"; sleep 10
          done
          echo "Servern svarade inte på /healthz i tid"; exit 1
