name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  publish-agent:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ win-x64, osx-arm64, osx-x64, linux-x64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/ProjectTime.Agent -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o out/agent-${{ matrix.rid }}
      - run: cp deploy/agent/* out/agent-${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: projecttime-agent-${{ matrix.rid }}
          path: out/agent-${{ matrix.rid }}
